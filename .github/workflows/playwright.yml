name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # CROSS-BROWSER TEST EXECUTION
  # ============================================================

  test:
    name: ${{ matrix.browser }} - Shard ${{ matrix.shard }}/4
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium
          - browser: Chromium
            shard: 1
          - browser: Chromium
            shard: 2
          - browser: Chromium
            shard: 3
          - browser: Chromium
            shard: 4

          # Firefox
          - browser: Firefox
            shard: 1
          - browser: Firefox
            shard: 2
          - browser: Firefox
            shard: 3
          - browser: Firefox
            shard: 4

          # WebKit
          - browser: WebKit
            shard: 1
          - browser: WebKit
            shard: 2
          - browser: WebKit
            shard: 3
          - browser: WebKit
            shard: 4

    env:
      CI: true
      PW_WORKERS: 4
      TEST_ENV: QA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version
        run: |
          npx playwright --version
          node -p "require('@playwright/test/package.json').version"

      - name: Run Playwright tests
        run: >
          npx playwright test
          --project="${{ matrix.browser }}"
          --shard=${{ matrix.shard }}/4
          --workers=${{ env.PW_WORKERS }}

      - name: Upload Playwright Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # MERGE REPORTS
  # ============================================================

  merge-reports:
    name: Merge Test Reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version
        run: npx playwright --version

      - name: Download Playwright Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: blob-reports
          merge-multiple: true

      - name: Merge Playwright HTML Report
        run: npx playwright merge-reports --reporter html blob-reports

      - name: Upload Merged Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: npx allure generate allure-results -o allure-report

      - name: Upload Merged Allure Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30